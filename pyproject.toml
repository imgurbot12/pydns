[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydns3"
version = "0.0.11"
requires-python = ">=3.8"
dependencies = [
    'httpx>=0.28.1',
    'anysql>=0.0.5',
    'pypool3>=0.0.5',
    'pyderive3>=0.0.7',
    'pystructs3>=0.0.8',
    'pyserve3>=0.0.8',
    'typing_extensions>=4.7.1',
]
authors = [{name = "Andrew C Scott", email = "imgurbot12@gmail.com"}]
description = "Simple Python DNS Library. DNS Packet-Parsing/Client/Server"
readme = {file = "README.md", content-type = "text/markdown"}
keywords = ["dns", "client", "server", "parser"]
classifiers = [
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15"
]

[project.urls]
Repository = "https://github.com/imgurbot12/pydns"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"pydns" = ["py.typed", "server/backend/_sql/*.sql"]
